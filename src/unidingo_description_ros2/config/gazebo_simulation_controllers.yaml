controller_manager:
  ros__parameters:
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mobile_base_controller:
      type: omni_drive_controller/OmniDriveController

    "left_arm/left_z1_joint_traj_controller":
      type: joint_trajectory_controller/JointTrajectoryController

    "left_arm/left_gripper_controller":
      type: position_controllers/GripperActionController

    "right_arm/right_z1_joint_traj_controller":
      type: joint_trajectory_controller/JointTrajectoryController

    "right_arm/right_gripper_controller":
      type: position_controllers/GripperActionController

"left_arm/left_gripper_controller":
  ros__parameters:
    joint: left_jointGripper
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 10.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0

"right_arm/right_gripper_controller":
  ros__parameters:
    joint: right_jointGripper
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 10.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
