twist_mux:
  ros__parameters:
    topics:
      - name: joy
        topic: joy_teleop/cmd_vel
        timeout: 0.5
        priority: 10
      - name: bt_joy
        topic: bluetooth_teleop/cmd_vel
        timeout: 0.5
        priority: 9
      - name: keyboard
        topic: keyboard_teleop/cmd_vel
        timeout: 0.5
        priority: 7
      - name: external
        topic: cmd_vel
        timeout: 0.5
        priority: 1
    locks:
      - name: e_stop
        topic: e_stop
        timeout: 0.0
        priority: 255
