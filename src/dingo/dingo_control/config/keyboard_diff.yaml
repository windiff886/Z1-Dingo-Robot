# Keyboard configuration for differential drive (matching teleop_diff.yaml axes)
#
# Key Layout:
#
#        W (forward)
#    A (left)   D (right)
#        S (backward)
#
#    Space: Enable (must hold, like L1)
#    Shift: Turbo mode (like R1)
#
# This config maps keyboard to the SAME Joy axes/buttons as PS4 controller,
# so teleop_twist_joy can be reused without modification.
#
# Joy Message Mapping (matching teleop_diff.yaml):
#   axes[0] = left/right (turn)     <- A/D keys
#   axes[1] = forward/backward      <- W/S keys
#   buttons[4] = enable (L1)        <- Space
#   buttons[5] = turbo (R1)         <- Shift

keyboard_to_joy:
  # Key bindings
  keys:
    forward: 'w'
    backward: 's'
    left: 'a'
    right: 'd'
    strafe_left: 'q'    # Not used in diff mode
    strafe_right: 'e'   # Not used in diff mode
    enable: ' '         # Space
    turbo: 'shift'

  # Axis mapping (must match teleop_diff.yaml)
  axis_map:
    forward_backward: 1   # axes[1] = W/S
    left_right: 0         # axes[0] = A/D (turn)
    strafe: -1            # Disabled for diff drive

  # Button mapping (must match teleop_diff.yaml)
  button_map:
    enable: 4             # buttons[4] = Space (like L1)
    turbo: 5              # buttons[5] = Shift (like R1)

  # Joy message size
  num_axes: 6
  num_buttons: 12
  rate: 20
