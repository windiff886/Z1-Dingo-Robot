# Keyboard configuration for omnidirectional drive (matching teleop_omni.yaml axes)
#
# Key Layout:
#
#        W (forward)
#    Q (strafe left)   E (strafe right)
#        S (backward)
#    A (turn left)     D (turn right)
#
#    Space: Enable (must hold, like L1)
#    Shift: Turbo mode (like R1)
#
# This config maps keyboard to the SAME Joy axes/buttons as PS4 controller,
# so teleop_twist_joy can be reused without modification.
#
# Joy Message Mapping (matching teleop_omni.yaml):
#   axes[0] = strafe left/right     <- Q/E keys
#   axes[1] = forward/backward      <- W/S keys
#   axes[3] = turn left/right       <- A/D keys
#   buttons[4] = enable (L1)        <- Space
#   buttons[5] = turbo (R1)         <- Shift

keyboard_to_joy:
  # Key bindings
  keys:
    forward: 'w'
    backward: 's'
    left: 'a'           # Turn left (maps to axes[3])
    right: 'd'          # Turn right (maps to axes[3])
    strafe_left: 'q'    # Strafe left (maps to axes[0])
    strafe_right: 'e'   # Strafe right (maps to axes[0])
    enable: ' '         # Space
    turbo: 'shift'

  # Axis mapping (must match teleop_omni.yaml)
  axis_map:
    forward_backward: 1   # axes[1] = W/S
    left_right: 3         # axes[3] = A/D (turn, like right stick)
    strafe: 0             # axes[0] = Q/E (strafe, like left stick horizontal)

  # Button mapping (must match teleop_omni.yaml)
  button_map:
    enable: 4             # buttons[4] = Space (like L1)
    turbo: 5              # buttons[5] = Shift (like R1)

  # Joy message size
  num_axes: 6
  num_buttons: 12
  rate: 20
