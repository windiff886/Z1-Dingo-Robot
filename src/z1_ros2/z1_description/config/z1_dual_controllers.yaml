# Dual Z1 arm controller configuration (left_ and right_ prefixed)
controller_manager:
  ros__parameters:
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    "left_arm/left_z1_joint_traj_controller":
      type: joint_trajectory_controller/JointTrajectoryController

    "left_arm/left_gripper_controller":
      type: position_controllers/GripperActionController

    "right_arm/right_z1_joint_traj_controller":
      type: joint_trajectory_controller/JointTrajectoryController

    "right_arm/right_gripper_controller":
      type: position_controllers/GripperActionController

"left_arm/left_z1_joint_traj_controller":
  ros__parameters:
    joints:
      - left_joint1
      - left_joint2
      - left_joint3
      - left_joint4
      - left_joint5
      - left_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

"left_arm/left_gripper_controller":
  ros__parameters:
    joint: left_jointGripper
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 10.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0

"right_arm/right_z1_joint_traj_controller":
  ros__parameters:
    joints:
      - right_joint1
      - right_joint2
      - right_joint3
      - right_joint4
      - right_joint5
      - right_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false

"right_arm/right_gripper_controller":
  ros__parameters:
    joint: right_jointGripper
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 10.0
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0
