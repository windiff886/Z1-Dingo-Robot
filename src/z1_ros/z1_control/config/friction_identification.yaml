# Test all six joints, one arm/joint at a time, returning to the fixed
# identification center after each joint. This center is NOT the Home pose.
# Choose a clear working pose with room on BOTH sides of every selected joint.
arms: [left, right]
joints: [1, 2, 3, 4, 5, 6]
# Empty: retain the measured working pose. Never automatically shift a center
# away from a joint limit. Optional values are six joint angles in radians.
# Offline candidate for both arms: [0, 0.8, -1.2, 0.4, 0, 0], pan/tilt zero.
# Confirm the arrival path and actual clearances before moving there; see
# FRICTION_IDENTIFICATION.md. Keeping [] does not command an automatic transfer.
centers:
  left: []
  right: []
amplitude: 0.15
speeds: [0.01, 0.02, 0.04, 0.08, 0.12]
repeats: 3
acceleration: 0.3
jerk: 2.0
goal_speed_scale: 0.05
settle_seconds: 0.5
startup_delay: 5.0
startup_timeout: 20.0
sample_timeout: 0.25
# These watch measured torque and request STOP; they are not firmware current limits.
effort_limit: [20, 30, 20, 12, 8, 8]
max_tracking_error: 0.02
other_joint_tolerance: 0.02
# Actual fresh-packet and sliding-data acceptance.
max_sample_gap: 0.02
velocity_window: 0.08
speed_tolerance: 0.2
steady_acceleration: 0.03
min_steady_fraction: 0.6
max_steady_gap: 0.12
min_steady_duration: 0.75
min_position_overlap: 0.01
static_enabled: true
static_repeats: 5
static_dwell: 2.0
static_offset: 0.01
static_speed: 0.001
breakaway_displacement: 0.00005
breakaway_persistence: 0.05
output_directory: ~/.ros/z1_friction
