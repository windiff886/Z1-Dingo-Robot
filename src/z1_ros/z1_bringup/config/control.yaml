# Shared joint control and model parameters for both Z1 arms.
# 250 Hz: leaves time for the measured ~2.63 ms SDK passive exchange.
# Measurements and limits: ../../COMMUNICATION_TIMING.md
period: 0.004
feedback_timeout: 0.08
stream_timeout: 0.2
# Short reference preview and bounded extrapolation for 20–100 Hz producers.
reference_preview: 0.03
reference_extrapolation: 0.1
reference_velocity_filter: 0.01
reference_horizon: 0.5
impedance_gain_time_constant: 0.1
command_max_age: 0.2
publish_rate: 100.0
# Optional native control-thread scheduling. Choose a permitted P-core CPU ID
# on the deployment machine; -1 leaves affinity to the OS. Priority 0 uses the
# current scheduler; a positive FIFO priority needs OS realtime permission.
control_cpu: -1
realtime_priority: 0
velocity: [0.8, 0.8, 0.8, 0.8, 0.8, 0.8]
acceleration: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
jerk: [8, 8, 8, 8, 8, 8]
torque: [20, 30, 20, 12, 8, 8]
torque_rate: [1000, 1000, 1000, 1000, 1000, 1000]
# MCU firmware joint position and velocity gains (hardware closed-loop position control):
mcu_kp: [500, 600, 500, 400, 300, 200]
mcu_kd: [5, 5, 5, 5, 5, 5]

# Host computed torque gains (must be strictly positive):
kp: [50, 80, 60, 35, 20, 20]
kd: [8, 12, 10, 6, 3, 3]
stiffness: [30, 30, 30, 0.2, 0.2, 0.2]
damping: [4, 4, 4, 0.02, 0.02, 0.02]
gravity: [0, 0, -9.81]
tool_frame: tool
position_tolerance: 0.015
velocity_tolerance: 0.03
# Encoder allowance at model bounds, in rad; targets remain strictly bounded.
joint_limit_tolerance: 0.001
# Start/resume tolerance is independent of the final settling velocity tolerance.
start_velocity_tolerance: 0.03
# Use fresh measured position travel over this many seconds to reject motion,
# without treating raw velocity spikes at a fixed position as real movement.
stationary_window: 0.1
settle_timeout: 3.0
tcp_position_tolerance: 0.005
tcp_orientation_tolerance: 0.025
