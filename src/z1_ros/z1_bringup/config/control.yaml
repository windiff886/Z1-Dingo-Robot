# Provisional engineering defaults; commission torque mode, gains and geometry on the actual Z1.
period: 0.002
feedback_timeout: 0.08
stream_timeout: 0.2
# Short reference preview and bounded extrapolation for 20–100 Hz producers.
reference_preview: 0.03
reference_extrapolation: 0.1
reference_velocity_filter: 0.01
reference_horizon: 0.5
impedance_gain_time_constant: 0.1
command_max_age: 0.2
publish_rate: 100.0
receive_budget_us: 1000
# Optional native control-thread scheduling. Choose a permitted P-core CPU ID
# on the deployment machine; -1 leaves affinity to the OS. Priority 0 uses the
# current scheduler; a positive FIFO priority needs OS realtime permission.
control_cpu: -1
realtime_priority: 0
velocity: [0.8, 0.8, 0.8, 0.8, 0.8, 0.8]
acceleration: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
jerk: [8, 8, 8, 8, 8, 8]
torque: [20, 30, 20, 12, 8, 8]
torque_rate: [1000, 1000, 1000, 1000, 1000, 1000]
# Computed torque: kp in s^-2, kd in s^-1 (not MCU position gains).
kp: [50, 80, 60, 35, 20, 20]
kd: [8, 12, 10, 6, 3, 3]
stiffness: [30, 30, 30, 0.2, 0.2, 0.2]
damping: [4, 4, 4, 0.02, 0.02, 0.02]
gravity: [0, 0, -9.81]
tool_frame: tool
collision_margin: 0.008
collision_warning: 0.03
geometry_radius_bound: 1.5
validation_budget: 2.0
lookahead_budget: 0.0005
position_tolerance: 0.015
velocity_tolerance: 0.03
settle_timeout: 3.0
tcp_position_tolerance: 0.005
tcp_orientation_tolerance: 0.025
# These pairs overlap around their mounting joints. Other pairs are checked.
ignored_collision_pairs:
  - [link00, link01]
  - [link01, link02]
  - [link02, link03]
  - [link03, link04]
  - [link04, link05]
  - [link05, link06]
  - [link06, tool]
  - [link00, link02]
  - [link04, link06]
  - [link05, tool]
# Fixed structures use metres and base-frame xyz/rpy. Populate from measured mounting geometry.
# Example schema (do not enable arbitrary geometry on a real installation):
# - name: support
#   size: [0.1, 0.1, 0.2]
#   xyz: [0.3, 0.0, -0.2]
#   rpy: [0.0, 0.0, 0.0]
fixed_boxes: []
