# Standalone arm.launch only: publish independent arm models and TF.
# The whole-robot RViz entry always owns its TF, regardless of this switch.
# Takes effect on restart; use a YAML boolean, not a quoted string.
publish_description: false

# Private parameters of the two controller nodes.
# MCU destination UDP port is 8880 in the vendor transport.
left_arm:
  controller:
    mcu_ip: 192.168.123.110
    local_port: 8881
    receive_budget_us: 1000

right_arm:
  controller:
    mcu_ip: 192.168.123.111
    local_port: 8882
    receive_budget_us: 1000
