# Private parameters of the rviz_tcp_test node.
# Send one pose goal after releasing a dragged TCP handle. When false, use
# the "Send target once" menu action instead.
send_on_release: true
# Joint-motion speed scale for pose goals, in (0, 1].
speed_scale: 0.15
# Maximum source-message age and time since receipt, in seconds.
telemetry_timeout: 0.3
