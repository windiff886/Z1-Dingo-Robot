# Unitree z1_ros d3bafd38 OMPL adapters; retain only its RRTConnect preset.
planning_plugin: ompl_interface/OMPLPlanner
request_adapters: default_planner_request_adapters/LimitMaxCartesianLinkSpeed default_planner_request_adapters/AddTimeParameterization
  default_planner_request_adapters/ResolveConstraintFrames default_planner_request_adapters/FixWorkspaceBounds
  default_planner_request_adapters/FixStartStateBounds default_planner_request_adapters/FixStartStateCollision
  default_planner_request_adapters/FixStartStatePathConstraints
start_state_max_bounds_error: 0.1
planner_configs:
  RRTConnect:
    type: geometric::RRTConnect
    range: 0.0
left_arm:
  planner_configs:
  - RRTConnect
  projection_evaluator: joints(left_joint1,left_joint2)
  longest_valid_segment_fraction: 0.005
right_arm:
  planner_configs:
  - RRTConnect
  projection_evaluator: joints(right_joint1,right_joint2)
  longest_valid_segment_fraction: 0.005
jiggle_fraction: 0.05
